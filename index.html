<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تحدي | لعبة التحديات السريعة</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
      min-height: 100vh;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: #f4f7fb;
      padding-bottom: 85px;
    }

    /* Header */
    .header {
      padding: 22px 18px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .welcome small {
      color: #7b8495;
      font-size: 13px;
    }

    .welcome h1 {
      margin-top: 5px;
      font-size: 23px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6c5ce7, #8e7dff);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 7px 18px rgba(108, 92, 231, .25);
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 12px 18px;
    }

    .stat {
      background: white;
      border-radius: 18px;
      padding: 15px 8px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(30, 40, 70, .06);
    }

    .stat-icon {
      font-size: 21px;
    }

    .stat strong {
      display: block;
      margin-top: 5px;
      font-size: 17px;
    }

    .stat span {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      color: #8b94a5;
    }

    /* Main challenge */
    .challenge {
      margin: 12px 18px;
      padding: 25px 20px;
      border-radius: 28px;
      color: white;
      background: linear-gradient(135deg, #5f4bd8, #806df0);
      box-shadow: 0 15px 30px rgba(95, 75, 216, .25);
      position: relative;
      overflow: hidden;
    }

    .challenge::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      left: -50px;
      bottom: -70px;
    }

    .challenge small {
      opacity: .85;
    }

    .challenge h2 {
      margin-top: 7px;
      font-size: 25px;
    }

    .challenge p {
      margin-top: 8px;
      opacity: .9;
      line-height: 1.7;
      font-size: 13px;
    }

    .start-btn {
      border: 0;
      background: white;
      color: #5744ce;
      padding: 14px 22px;
      border-radius: 15px;
      margin-top: 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .start-btn:active {
      transform: scale(.97);
    }

    /* Sections */
    .section {
      padding: 12px 18px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title h3 {
      font-size: 18px;
    }

    .section-title span {
      font-size: 12px;
      color: #6c5ce7;
    }

    .modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .mode {
      background: white;
      border: 0;
      border-radius: 20px;
      padding: 18px 14px;
      text-align: right;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(30,40,70,.06);
      transition: .2s;
    }

    .mode:active {
      transform: scale(.96);
    }

    .mode-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: #f0edff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      margin-bottom: 10px;
    }

    .mode strong {
      display: block;
      font-size: 15px;
    }

    .mode span {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      color: #8b94a5;
    }

    /* Friend challenge */
    .friend {
      background: white;
      border-radius: 22px;
      padding: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 5px 18px rgba(30,40,70,.06);
    }

    .friend-info {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .friend-avatar {
      width: 44px;
      height: 44px;
      background: #ffe7a8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .friend-info strong {
      font-size: 14px;
    }

    .friend-info span {
      display: block;
      color: #8b94a5;
      font-size: 11px;
      margin-top: 4px;
    }

    .challenge-friend {
      border: 0;
      background: #eeeaff;
      color: #5f4bd8;
      padding: 10px 13px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(480px, 100%);
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 10px 8px 12px;
      border-top: 1px solid #e9edf4;
      z-index: 10;
    }

    .nav-item {
      border: 0;
      background: transparent;
      color: #8b94a5;
      font-size: 11px;
      cursor: pointer;
      padding: 5px;
    }

    .nav-item div {
      font-size: 20px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #5f4bd8;
      font-weight: bold;
    }

    /* Popup */
    .popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20,25,40,.55);
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
    }

    .popup.show {
      display: flex;
    }

    .popup-box {
      width: 100%;
      max-width: 390px;
      background: white;
      border-radius: 25px;
      padding: 25px;
      text-align: center;
    }

    .popup-box .big {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .popup-box h2 {
      margin-bottom: 8px;
    }

    .popup-box p {
      color: #7b8495;
      font-size: 13px;
      line-height: 1.7;
    }

    .close-btn {
      width: 100%;
      border: 0;
      background: #5f4bd8;
      color: white;
      padding: 13px;
      border-radius: 14px;
      margin-top: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="welcome">
      <small>مرحباً بك 👋</small>
      <h1>يا بطل! 🔥</h1>
    </div>

    <div class="avatar">😎</div>
  </header>

  <!-- Statistics -->
  <section class="stats">

    <div class="stat">
      <div class="stat-icon">🏆</div>
      <strong id="points">1250</strong>
      <span>النقاط</span>
    </div>

    <div class="stat">
      <div class="stat-icon">⚡</div>
      <strong>12</strong>
      <span>المستوى</span>
    </div>

    <div class="stat">
      <div class="stat-icon">🔥</div>
      <strong>7</strong>
      <span>أيام متتالية</span>
    </div>

  </section>

  <!-- Main challenge -->
  <section class="challenge">

    <small>⚡ تحدي اليوم</small>

    <h2>هل أنت الأسرع؟</h2>

    <p>
      اختبر سرعة تفكيرك وحاول تحقيق أعلى نتيجة
      قبل انتهاء الوقت!
    </p>

    <button class="start-btn" onclick="startChallenge()">
      ابدأ التحدي الآن 🚀
    </button>

  </section>

  <!-- Game modes -->
  <section class="section">

    <div class="section-title">
      <h3>اختر تحديك</h3>
      <span>عرض الكل</span>
    </div>

    <div class="modes">

      <button class="mode" onclick="showMessage('🧠 تحدي الذكاء')">
        <div class="mode-icon">🧠</div>
        <strong>اختبار الذكاء</strong>
        <span>اختبر سرعة تفكيرك</span>
      </button>

      <button class="mode" onclick="showMessage('⚡ تحدي السرعة')">
        <div class="mode-icon">⚡</div>
        <strong>تحدي السرعة</strong>
        <span>كن الأسرع بين أصدقائك</span>
      </button>

      <button class="mode" onclick="showMessage('🎯 تحدي الدقة')">
        <div class="mode-icon">🎯</div>
        <strong>تحدي الدقة</strong>
        <span>اختبر تركيزك</span>
      </button>

      <button class="mode" onclick="showMessage('🎲 تحدي عشوائي')">
        <div class="mode-icon">🎲</div>
        <strong>عشوائي</strong>
        <span>ماذا سيظهر لك؟</span>
      </button>

    </div>

  </section>

  <!-- Friend -->
  <section class="section">

    <div class="section-title">
      <h3>تحدي صديق 👥</h3>
    </div>

    <div class="friend">

      <div class="friend-info">

        <div class="friend-avatar">👤</div>

        <div>
          <strong>تحدى أصدقاءك</strong>
          <span>أرسل تحدياً وشاهد من يفوز</span>
        </div>

      </div>

      <button
        class="challenge-friend"
        onclick="showMessage('👥 سيتم فتح قائمة الأصدقاء قريباً')">
        تحدي
      </button>

    </div>

  </section>

</div>

<!-- Bottom navigation -->
<nav class="bottom-nav">

  <button class="nav-item active" onclick="showMessage('🏠 الرئيسية')">
    <div>🏠</div>
    الرئيسية
  </button>

  <button class="nav-item" onclick="startChallenge()">
    <div>🎮</div>
    اللعب
  </button>

  <button class="nav-item" onclick="showMessage('👥 الأصدقاء')">
    <div>👥</div>
    الأصدقاء
  </button>

  <button class="nav-item" onclick="showMessage('👤 الملف الشخصي')">
    <div>👤</div>
    حسابي
  </button>

</nav>

<!-- Popup -->
<div class="popup" id="popup">

  <div class="popup-box">

    <div class="big">🚀</div>

    <h2 id="popupTitle">جاهز؟</h2>

    <p id="popupText">
      سيتم فتح التحدي قريباً.
    </p>

    <button class="close-btn" onclick="closePopup()">
      حسناً
    </button>

  </div>

</div>

<script>

  let points = 1250;

  function startChallenge() {

    points += 10;

    document.getElementById("points").textContent = points;

    showMessage(
      "🚀 التحدي جاهز!",
      "هذه أول نسخة من اللعبة. في الخطوة القادمة سنبني شاشة اللعب الحقيقية بالأسئلة والوقت والنقاط."
    );
  }

  function showMessage(title, text = "هذه الميزة سيتم تطويرها في الخطوات القادمة.") {

    document.getElementById("popupTitle").textContent = title;
    document.getElementById("popupText").textContent = text;

    document.getElementById("popup").classList.add("show");
  }

  function closePopup() {

    document.getElementById("popup").classList.remove("show");

  }

  document.getElementById("popup").addEventListener("click", function(e) {

    if (e.target === this) {
      closePopup();
    }

  });

</script>

</body>
  </html>
